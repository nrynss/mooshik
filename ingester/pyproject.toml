[project]
name = "mooshik-ingester"
version = "0.1.0"
description = "Mooshik bootstrap ingester: corpus -> Gemini Flash concepts -> Cloud SQL graph via lambo serve (MCP)."
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2",
    "google-genai>=1.0",
    "google-adk>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["ingester*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

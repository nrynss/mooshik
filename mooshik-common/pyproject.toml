[project]
name = "mooshik-common"
version = "0.2.1"
description = "Shared ground for Mooshik's Python components: Vertex client, model/location defaults, concept vocabulary."
requires-python = ">=3.10"
dependencies = [
    # Exact pins, mirroring every other package here: CI installs these
    # directly, so a floating range would make builds non-reproducible.
    # Bump deliberately, and bump the consumers in the same commit.
    "google-genai==2.20.0",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mooshik_common*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

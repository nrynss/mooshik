[package]
name = "mooshik"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
description = "An ambient, local-first AI cowork partner and workspace orchestrator"

[dependencies]
anyhow = "1"
argon2 = "0.5"
chacha20poly1305 = "0.10"
clap = "4"
rand = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
fs2 = "0.4"
libc = "0.2"
zeroize = { version = "1", features = ["serde"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", default-features = false, features = ["linux-native-sync-persistent", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", default-features = false, features = ["apple-native"] }

[profile.release]
lto = "thin"

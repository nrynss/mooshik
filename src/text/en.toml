# M11's TUI. Panel titles, the nav rail and the key hints on the bottom rule —
# every fixed string the artboards draw. What a day actually contains is content
# rather than chrome and arrives in the view model, so none of it is here.
[tui]
help = "Open the terminal interface"
after_help = "The conversation, what the graph is doing underneath it, and what keeps coming back — in one pane you leave open.\n\nExamples:\n  mooshik tui                  the live workspace\n  mooshik tui --demo           the design's demo day, touching nothing\n  mooshik tui --demo recall    the same day with Monday's words quoted back\n  mooshik tui --demo caution   the same day with one careful sentence standing\n\nKeys: Tab cycles panels · ^1 today · ^2 the week · Esc stops a reply then leaves · ^C leaves. Needs a terminal; 80x24 is the smallest useful size."
demo_help = "Draw the design's demo day instead of the live workspace, reading no configuration and opening no database. Takes an optional scene: today (the default), recall, or caution."
brand = "Mooshik"
separator = "  ·  "
# The same bullet, tight, for body text. The title rule and the bottom rule
# space it out ("Mooshik  ·  Thursday 27 August"); inside a panel the artboards
# set it close — `1b`'s detail head is "Rain, 15° · A rough day".
separator_tight = " · "
nav_gap = "   "
nav_today = "Today"
nav_week = "The week"
week_title = "Your week"

panel_conversation = "The conversation"
panel_composer = "You"
panel_today = "Today"
panel_threads = "What keeps coming back"
panel_leans = "What leans on this"
panel_trickle = "Just remembered"
panel_caution = "One thing before you do"

# The one or two words beside the affirming mark. Never a sentence — `1i`. The
# mark itself is a glyph, so it lives in Rust: see `widget::marks`.
health_keeping_up = "Keeping up"
health_catching_up = "Catching up"
health_degraded = "Not saving"
# How much is behind the state, in three renderings of the same fact. The long
# form names the far end of what the session remembers and the short one does
# not, because the week screen's rule already carries the week beside it — two
# written forms, not a truncation, for the reason `Stamp::short_date` is two
# fields. `scope_live` is the long form for a graph with no far end to name: a
# session with nothing in it has no day to go back to.
scope_live = "{count} things remembered"
scope_since = "{count} things remembered, back to {date}"
scope_short = "{count} remembered"
# Until a workspace says whose it is, the conversation needs a name for the
# person's turns.
person_unknown = "You"
# When there is no controlling terminal to take: `mooshik tui` in a pipe, a cron
# job, or a CI step.
needs_a_terminal = "The terminal interface needs a terminal to draw on, and this process has none. Run `mooshik tui` from an interactive shell; the recall, stats and chat commands write to a pipe and work anywhere."
# When the terminal was taken successfully and then failed mid-session: a draw,
# a poll or a read went wrong. Not the same fault as having no terminal at all,
# so not the same sentence.
session_failed = "The terminal interface stopped because the terminal could not be drawn to or read from. Your shell has been put back the way it was; run `mooshik tui` again to reopen it."
watcher_workspace_unavailable = "The current workspace could not be watched. Check that it is a readable directory, then run `mooshik tui` again."
watcher_task_failed = "The workspace watcher stopped unexpectedly. Run `mooshik tui` again to resume live changes."
watcher_memory_failed = "A workspace change could not be written to memory. The watcher will retry while the pane remains open."
hint_composer = "Nothing here needs saving"
# Placeholder on the in-flight assistant turn, replaced by the first token.
# A blank Said draws as a speaker with no words, which is the inert-Enter
# failure again; this glyph is the pending marker the artboards do not have
# because they never showed a turn in flight.
turn_pending = "…"
# Only keys `tui::input` binds may appear here — a hint is a promise. See the
# header of that module for the whole keymap.
hint_today = "Tab panel · J/K a thread · ^2 week · Esc stops"
hint_week = "H/L a day · J/K a thread · ^1 today · Esc stops"
# No `Tab panel` here. `1h` collapses the three right-hand panels to two summary
# rows and drops the third, so the narrow layout has exactly one focus — the
# conversation and the composer, which share it — and `Tab` deliberately moves
# nothing. A key that is bound and does nothing is the same broken promise as a
# key that is not bound at all. `J/K a thread` is absent for the same reason:
# this screen draws no thread cursor.
hint_narrow = "^2 week · Esc stops"
# Not a key hint: how many threads the collapsed line did not have room for.
# `{count}` is spelled where the artboards spell it — see [tui.numbers].
narrow_more = "{count} more"
# The same statement for the week screen: how many day columns the terminal is
# too narrow to show. `1h` says "four more" beside the thread line it truncated;
# this says it on the bottom rule about the columns it windowed away.
#
# Two keys, because English inflects the noun and "one more days" is not a
# sentence anybody wrote. A locale with three plural forms adds its own keys here
# and reads them in `week::offscreen_note`; deriving the plural from the count in
# Rust would put a grammar rule in the renderer, which is exactly what this file
# exists to prevent.
week_offscreen = "{count} more days"
week_offscreen_one = "one more day"
narrow_trickle_prefix = "· Just remembered: "

# The gutter a thread's marks sit in, for a week that does not name its own
# days — the design's own Friday-first Thursday, which is what `--demo` draws.
# A live week ends on today, so it names its seven days in `Week::day_heads` and
# `week::day_header` builds the row from those instead; this is the fallback and
# the demo's. The trickle's bullet is a glyph, so it lives in Rust: see
# `widget::marks`.
week_day_header = "  Fri Sat Sun Mon Tue Wed Thu"

# How the live workspace writes the six renderings of one instant that
# `model::Stamp`, `model::Day` and `model::Week` carry as strings.
#
# Templates rather than a `strftime` pattern, for the reason `[tui.numbers]`
# exists: the order of weekday, day and month is a property of a language, and
# so are the names themselves — `chrono`'s `%A`/`%B` are English and nothing
# else. A locale reorders these freely and translates the four tables below.
#
# `{day}` is never zero-padded: the artboards write "Thursday 27 August", and a
# locale wanting "07" can say so in its own tables. `{hour}` and `{minute}` are,
# because "14:2" is not a clock.
date_long = "{weekday} {day} {month}"
date_short = "{weekday} {day} {month}"
# A date with no weekday, for the status bar's "back to 21 August": the weekday
# of a day months ago is not something the reader asked about.
date_day_month = "{day} {month}"
day_head = "{weekday} {day}"
clock = "{hour}:{minute}"
# The week's range on the title rule. Two keys, because a week that crosses a
# month names it twice and one that does not names it once — "21-27 August"
# against "29 August - 4 September". Deriving the second from the first would
# put a calendar rule in the renderer.
week_span = "{from}-{to} {month}"
week_span_across = "{from} {from_month} - {to} {to_month}"

# Small numbers, spelled. Every artboard writes them out in prose — `1d`'s
# "Eight things lean on it:", `1h`'s "four more" — so a generated sentence has
# to as well, and how far a language spells before it gives up and uses digits
# is a property of that language. Above twelve the numeral is used; see
# `screen::spelled`, which is the only reader of this table.
[tui.numbers]
1 = "one"
2 = "two"
3 = "three"
4 = "four"
5 = "five"
6 = "six"
7 = "seven"
8 = "eight"
9 = "nine"
10 = "ten"
11 = "eleven"
12 = "twelve"

# The caution's dependency list gets a generated header, so its count is
# substituted rather than written. Where the design spells it out — "eight other
# notes lean on it" — that sentence is content and arrives in the view model,
# which is where a locale can spell it however it likes.
[tui.leans]
# `{Count}` rather than `{count}`: this sentence starts with the number, so the
# word needs its capital — `1d` writes " Eight things lean on it:". A locale that
# does not capitalise there uses `{count}` and gets the plain word.
#
# Two keys, for the reason `week_offscreen` has two: English inflects the noun,
# and a thread with one dependent is ordinary data — `today.rs`'s own fixture is
# exactly that — so the single form is reached without anything unusual
# happening. "One things lean on it:" is not a sentence anybody wrote. A locale
# with three plural forms adds its own keys here and reads them in
# `aside::leans_on`.
header = "{Count} things lean on it:"
header_one = "One thing leans on it:"
# What the list says about the names the panel had no room for. `1d`'s own list
# ends "... and five more", because its eight dependents do not fit either — the
# header states a count, so the list has to account for all of it.
more = "... and {count} more"
more_one = "... and one more"

# The 80-column nav, which abbreviates rather than wrapping. Artboard `1h`.
[tui.narrow]
nav_gap = "  "
nav_week = "Week"
# What joins the collapsed trickle's entries. Punctuation between words is
# prose, not notation, so a locale that separates lists differently can say so.
list_separator = ", "

# The calendar, keyed by the numbers `chrono` counts in: weekdays 1–7 from
# Monday, months 1–12 from January. Four tables rather than two, because the
# short forms are written and not truncated — the same rule `Stamp::short_date`
# and `Health::short_scope` are two fields for. The week screen's day header
# lays its heads on a four-cell stride, so a short weekday that is not three
# cells wide is padded or cut by `week::day_header`, never by this file.
[tui.weekday]
1 = "Monday"
2 = "Tuesday"
3 = "Wednesday"
4 = "Thursday"
5 = "Friday"
6 = "Saturday"
7 = "Sunday"

[tui.weekday_short]
1 = "Mon"
2 = "Tue"
3 = "Wed"
4 = "Thu"
5 = "Fri"
6 = "Sat"
7 = "Sun"

[tui.month]
1 = "January"
2 = "February"
3 = "March"
4 = "April"
5 = "May"
6 = "June"
7 = "July"
8 = "August"
9 = "September"
10 = "October"
11 = "November"
12 = "December"

[tui.month_short]
1 = "Jan"
2 = "Feb"
3 = "Mar"
4 = "Apr"
5 = "May"
6 = "Jun"
7 = "Jul"
8 = "Aug"
9 = "Sep"
10 = "Oct"
11 = "Nov"
12 = "Dec"

# M11's TUI. Panel titles, the nav rail and the key hints on the bottom rule —
# every fixed string the artboards draw. What a day actually contains is content
# rather than chrome and arrives in the view model, so none of it is here.
[tui]
help = "Open the terminal interface"
after_help = "The conversation, what the graph is doing underneath it, and what keeps coming back — in one pane you leave open.\n\nExamples:\n  mooshik tui           the live workspace\n  mooshik tui --demo    the design's own demo day, touching nothing\n\nKeys: Tab cycles panels · ^1 today · ^2 the week · Enter sends · Alt-Enter is a newline · Esc or ^C leaves. Needs a terminal; 80x24 is the smallest useful size."
demo_help = "Draw the design's demo day instead of the live workspace. Reads no configuration and opens no database."
brand = "Mooshik"
separator = "  ·  "
nav_gap = "   "
nav_today = "Today"
nav_week = "The week"
nav_settings = "^, settings"
nav_keys = "? keys"
week_title = "Your week"

panel_conversation = "The conversation"
panel_composer = "You"
panel_today = "Today"
panel_threads = "What keeps coming back"
panel_leans = "What leans on this"
panel_trickle = "Just remembered"
panel_caution = "One thing before you do"

# The affirming mark and the one word beside it. Never a sentence.
health_mark = "✓"
# The one or two words beside the mark. Never a sentence — `1i`.
health_keeping_up = "Keeping up"
health_catching_up = "Catching up"
health_degraded = "Not saving"
scope_live = "{count} things remembered"
# Until a workspace says whose it is, the conversation needs a name for the
# person's turns.
person_unknown = "You"
# Shown in place of the mark when Mooshik is behind. Furniture, not red — red is
# reserved for a refused credential and for leaving a database behind.
health_behind = "·"

hint_composer = "Enter send  ·  Alt-Enter newline  ·  Nothing here needs saving"
hint_today = "Tab panel · Alt-H/L resize · ^K a day · ? keys"
hint_recall = "Enter open the source · J/K scroll · ^2 week · ?"
hint_caution = "Enter show what leans on it · J/K scroll · ^2 week · ?"
hint_week = "H/L a day · J/K a thread · Enter open the day · / find · ^1 today"
hint_narrow = "Tab panel · ^2 week · ?"
hint_narrow_more = "^3 {count} more"
narrow_trickle_prefix = "· Just remembered: "

# The bullet the trickle hangs from, and the gutter a thread's marks sit in.
trickle_bullet = " · "
week_day_header = "  Fri Sat Sun Mon Tue Wed Thu"

# The caution's dependency list gets a generated header and key hint, so the
# count is a numeral here. Where the design spells it out — "eight other notes
# lean on it" — that sentence is content and arrives in the view model, which is
# where a locale can spell it however it likes.
[tui.leans]
header = "{count} things lean on it:"

# The 80-column nav, which abbreviates rather than wrapping. Artboard `1h`.
[tui.narrow]
nav_gap = "  "
nav_week = "Week"
nav_keys = "?"

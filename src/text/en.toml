# All user-facing strings for the default locale (English).
#
# Every string a user can see — help text, error messages, labels — lives here,
# never inline in Rust source. New surface added by a milestone adds its keys
# under the matching section. Localization later means shipping another file
# with the same schema and selecting it in config; no call sites change.
#
# Key lookup is dotted (`app.about` → `[app] about = ...`). A missing key is a
# programmer error and panics at the call site; keep this file and its tests in
# sync.

[app]
about = "An ambient, local-first AI cowork partner and workspace orchestrator"
after_help = "Mooshik runs alongside you as a peer: it holds your workspace's memory, researches the web, and delegates code changes to coding agents.\nDocs: docs/SPEC.md · Build plan: dev-diary/PLAN.md"

[config]
init_help = "Create the Mooshik home directory, its private files, and the memory store schema. Schema provision needs MOOSHIK_POSTGRES_DSN (or LAMBO_POSTGRES_DSN / DATABASE_URL)."
show_help = "Print the resolved configuration"
read_failed = "Could not read the Mooshik configuration. Check the file and its permissions."
home_unavailable = "Could not determine your home directory. Set MOOSHIK_HOME and try again."
invalid_toml = "The Mooshik configuration is not valid TOML. Fix it and try again."
invalid_value = "The Mooshik configuration contains an unsupported value. Use keyring or passphrase."
invalid_store_kind = "The store kind is not supported. Use postgres, or memory for tests."
invalid_embedder = "The embedder kind is not supported. Use gemini, or fixture for tests."
invalid_number = "A numeric configuration value could not be parsed. Check embed dim, flush interval, context window, and temperature."
zero_flush = "The memory flush interval must be greater than zero."
zero_context_window = "The companion context window must be greater than zero."
dsn_conflict = "MOOSHIK_POSTGRES_DSN and LAMBO_POSTGRES_DSN (or DATABASE_URL) name different databases. Unset one of them or make them agree."
show_failed = "Could not load the Mooshik configuration. Fix the file and try again."

[home]
init_failed = "Could not initialize the Mooshik home directory. Check its path and permissions."
missing = "The Mooshik home does not exist yet. Run `mooshik init` first, or set MOOSHIK_HOME to an initialized home."
init_done = "Mooshik home initialized."
unsafe_path = "The Mooshik home contains a symbolic link or unsafe path component. Choose a private, non-symlinked path."
migration_required = "The existing private directory is not marked as a Mooshik home. Back it up, move it aside, then run `mooshik init`; existing data will not be modified automatically."
layout_conflict = "The Mooshik home has an incompatible vault layout. Move the old vault directory and try again."

[vault]
set_help = "Encrypt and store a secret value"
set_after_help = "Value input: when MOOSHIK_SECRET_VALUE is set, Mooshik reads the value from that environment variable; otherwise it reads bounded input from stdin. Trailing CR/LF is removed; input must be non-empty and at most 1 MiB. Literal secret values cannot be supplied as command-line arguments."
get_help = "Decrypt and print a secret value"
list_help = "List secret names without revealing values"
name_help = "Secret name"
set_failed = "Could not store the secret. Check the name, home directory, and key provider."
get_failed = "Could not read that secret. Check its name, the key provider, and passphrase."
list_failed = "Could not list secrets. Check the home directory and key provider."
io_failed = "The encrypted vault could not be read or written. Check its permissions."
invalid_format = "The encrypted vault has an invalid format. Restore a valid vault or remove it to start over."
authentication_failed = "The vault could not be authenticated. Check the passphrase or keyring entry."
keyring_failed = "The operating-system keyring is unavailable. Select passphrase mode and provide MOOSHIK_VAULT_PASSPHRASE."
random_failed = "The system secure random source was unavailable. Try again."
key_derivation_failed = "The passphrase could not be processed securely. Try again."
missing_passphrase = "Passphrase mode requires a non-empty MOOSHIK_VAULT_PASSPHRASE environment variable."
invalid_name = "Secret names must be 1–64 ASCII letters, digits, dots, underscores, or hyphens."
not_found = "That secret does not exist. Check the name and try again."
unsafe_path = "The encrypted vault path contains a symbolic link or unsafe component. Choose a private, non-symlinked home."
lock_failed = "The encrypted vault could not be locked safely. Check its permissions and try again."
missing_value = "Secret values must be non-empty. Provide MOOSHIK_SECRET_VALUE or stdin."
input_too_large = "That secret input or encrypted vault is larger than the supported limit. Reduce it and try again."

[memory]
serve_help = "Serve Lambo memory over MCP and publish a session endpoint"
serve_after_help = "Serves Lambo's MCP tool surface on stdio by default and publishes a local session endpoint so a losing `lambo serve` can proxy into this process. Postgres needs MOOSHIK_POSTGRES_DSN (or LAMBO_POSTGRES_DSN / DATABASE_URL). Gemini credentials follow Lambo's ADC chain."
missing_dsn = "No Postgres DSN is configured. Set MOOSHIK_POSTGRES_DSN and try again."
backend_failed = "Could not use the workspace memory. Check the store, embedder, and credentials."
runtime_failed = "Could not start the async runtime for workspace memory."

[companion]
chat_help = "Chat with the companion model"
chat_after_help = "Requires an initialized home (`mooshik init`). Talks to the OpenAI-compatible endpoint in [companion]. Does not open workspace memory. Empty lines are ignored. EOF exits. Ctrl-C cancels an in-flight reply; a second interrupt or EOF exits."
system_prompt = "You are Mooshik, a cowork partner. You do not remember earlier windows; the workspace graph does. Prefer tools when they are available. Be concise."
unreachable = "Could not reach the companion model. Check companion.base_url and that the server is running."
timeout = "The companion model did not respond in time. Check that the server is running and try again."
http_status = "The companion model returned an error. Check the endpoint URL, model name, and credentials, then try again."
cancelled = "The in-flight companion reply was cancelled."
invalid_response = "The companion model returned a response that could not be read. Check the endpoint and try again."
turn_too_large = "This message is too large for the companion context window. Shorten it and try again."
runtime_failed = "Could not start the async runtime for the companion chat."
io_failed = "Could not read input for the companion chat. Check the terminal and try again."
malformed_tool_args = "Tool arguments were not a JSON object. Retry with a JSON object."
unknown_tool = "That tool is not available."
tool_loop = "The companion kept calling tools without finishing. Try again."

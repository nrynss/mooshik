# The artboards' own content, as a Workspace.
#
# This is the design's demo day, transcribed from `scratch_design/Mooshik
# TUI.dc.html` — a Thursday with a postmortem, a novel finished on the train and
# an unreturned call to Mum. It exists so `mooshik tui --demo` draws the
# artboards exactly, and so the layout tests have something to assert against
# without a database, a model endpoint or a clock behind them.
#
# It lives in TOML rather than in Rust for the reason the whole crate keeps prose
# out of source (see `src/text/en.toml`): a screenful of someone's week is text,
# it would swamp the file-size budget, and it should be editable without
# recompiling the renderer.
#
# Prose here is UNWRAPPED. Panels break it themselves — the same sentence renders
# at three widths — so do not hand-wrap these strings.


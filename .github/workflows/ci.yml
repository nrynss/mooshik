name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # dtolnay/rust-toolchain master; installs the version pinned in rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: File size cap (1000 lines)
        run: |
          over=$(wc -l $(git ls-files '*.rs') | awk '$NF != "total" && $1 > 1000')
          if [ -n "$over" ]; then
            echo "::error::Files exceed the 1000-line cap:"
            echo "$over"
            exit 1
          fi

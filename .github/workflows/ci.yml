name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # dtolnay/rust-toolchain master; installs the version pinned in rust-toolchain.toml
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: "1.97.1"
          components: clippy, rustfmt

      - name: Format
        run: cargo fmt --check

      # linux-native-sync-persistent pulls dbus-secret-service, which links
      # against libdbus. ubuntu-latest does not ship the headers.
      - name: Install dbus headers
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config

      - name: Build
        run: cargo build --locked

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy -- -D warnings

      - name: File size cap (1000 lines)
        run: |
          over=$(wc -l $(git ls-files '*.rs') | awk '$NF != "total" && $1 > 1000')
          if [ -n "$over" ]; then
            echo "::error::Files exceed the 1000-line cap:"
            echo "$over"
            exit 1
          fi

  # M8 bootstrap ingester: offline seam tests only (no Google, no Cloud SQL).
  ingester:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v5 (pinned by tag SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install ingester deps
        # Exact pins, mirrored from ingester/pyproject.toml — reproducible installs.
        run: pip install pytest==9.1.1 mcp==2.1.1 google-genai==2.20.0 google-adk==2.7.1

      - name: Test (offline)
        run: pytest ingester/tests -q

  # M10 news MCP server: offline seam tests only (no Google, no network).
  news-mcp:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v5 (pinned by tag SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install news MCP deps
        # Exact pins, mirrored from mcp-servers/news/pyproject.toml. No
        # google-adk: an MCP tool call is one request/response, so this server
        # drives google-genai directly rather than running an ADK Runner.
        run: pip install pytest==9.1.1 mcp==2.1.1 google-genai==2.20.0

      - name: Test (offline)
        run: pytest mcp-servers/news/tests -q

  # M9 measurement harness: offline seam tests only (no Cloud SQL).
  measurement:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # actions/setup-python v5 (pinned by tag SHA)
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13"

      - name: Install measurement deps
        # Exact pins mirrored from measurement/pyproject.toml. psycopg is
        # imported lazily, so the offline suite does not even need it — but
        # installing it here keeps the pin honest.
        run: pip install pytest==9.1.1 'psycopg[binary]==3.2.13'

      - name: Test (offline)
        run: pytest measurement/tests -q
